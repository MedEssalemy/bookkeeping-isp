name: Build & deploy (reusable)

# Builds the backend + frontend images, pushes them to GitHub Container
# Registry, and rolls them out to one Azure Container Apps environment.
#
# Azure access uses OIDC (no stored credentials). Per GitHub *environment*
# (dev / prod) set these Variables — none of them are secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   AZURE_RESOURCE_GROUP, AZURE_ACR_NAME, AZURE_BACKEND_APP, AZURE_FRONTEND_APP
# Images are copied GHCR -> the environment's Azure Container Registry, which
# the apps pull from with their managed identity (no registry password).
# App secrets (DB password, JWT key) live in Azure Key Vault and are referenced
# by the Container Apps directly — see infra/azure/README.md.
# Until the variables exist the deploy step is skipped with a warning.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment / target (dev or prod)
        type: string
        required: true
      image_tag:
        description: Immutable tag to deploy (sha-xxxxxxx or vX.Y.Z)
        type: string
        required: true
      extra_tag:
        description: Moving tag to also push (dev or prod)
        type: string
        required: true
    outputs:
      deployed:
        value: ${{ jobs.deploy.outputs.deployed }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.names.outputs.backend }}
      frontend_image: ${{ steps.names.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names (GHCR requires lowercase)
        id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repo}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repo}-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:${{ inputs.image_tag }}
            ${{ steps.names.outputs.backend }}:${{ inputs.extra_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.names.outputs.frontend }}:${{ inputs.image_tag }}
            ${{ steps.names.outputs.frontend }}:${{ inputs.extra_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.rollout.outputs.url }}
    permissions:
      contents: read
      packages: read    # lets ACR import the images from GHCR
      id-token: write   # OIDC login to Azure
    outputs:
      deployed: ${{ steps.check.outputs.configured }}
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR: ${{ vars.AZURE_ACR_NAME }}
      BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
      FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
    steps:
      - name: Check Azure configuration
        id: check
        run: |
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "$RG" ] || [ -z "$ACR" ] || [ -z "$BACKEND_APP" ] || [ -z "$FRONTEND_APP" ]; then
            echo "::warning::Azure variables are not set for the '${{ inputs.environment }}' environment — images were pushed but nothing was deployed. See infra/azure/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.check.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out new images
        id: rollout
        if: steps.check.outputs.configured == 'true'
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          tag="${{ inputs.image_tag }}"
          az acr import --name "$ACR" --source "${{ needs.build.outputs.backend_image }}:$tag" \
            --image "bookkeeping-backend:$tag" --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" --force --only-show-errors
          az acr import --name "$ACR" --source "${{ needs.build.outputs.frontend_image }}:$tag" \
            --image "bookkeeping-frontend:$tag" --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" --force --only-show-errors
          registry="$ACR.azurecr.io"
          # Backend first: it runs migrations on start, before the new UI goes live.
          az containerapp update -g "$RG" -n "$BACKEND_APP" --image "$registry/bookkeeping-backend:$tag" \
            --set-env-vars "APP_VERSION=$tag" --only-show-errors -o none
          az containerapp update -g "$RG" -n "$FRONTEND_APP" --image "$registry/bookkeeping-frontend:$tag" \
            --only-show-errors -o none
          fqdn="$(az containerapp show -g "$RG" -n "$FRONTEND_APP" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "url=https://${fqdn}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.check.outputs.configured == 'true'
        run: |
          url="${{ steps.rollout.outputs.url }}"
          # A bad login must come back 401 from the API through the frontend's
          # nginx proxy — proves UI, proxy, backend and DB are all up.
          for i in $(seq 1 30); do
            ui=$(curl -s -o /dev/null -w '%{http_code}' "$url/" || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/api/v1/auth/login" \
                  -H 'Content-Type: application/json' -d '{"email":"smoke@test.invalid","password":"x"}' || true)
            echo "attempt $i: ui=$ui api=$api"
            if [ "$ui" = "200" ] && [ "$api" = "401" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Deployment did not become healthy at $url"
          exit 1
